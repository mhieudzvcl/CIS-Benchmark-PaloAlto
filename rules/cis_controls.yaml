benchmark: 'CIS Palo Alto Firewall 11 Benchmark v1.2.0'
# Triển khai chọn lọc 14 control. Không phải toàn bộ Benchmark.
# Kiểm tra ràng buộc theo cấu hình thực tế, không suy luận PASS khi thiếu evidence.
controls:
  - id: '1.2.3'
    title: 'Disable HTTP and Telnet on management interface'
    type: management_services
  - id: '1.3.1'
    title: 'Minimum Password Complexity enabled'
    type: password_enabled
  - id: '1.3.2'
    title: 'Minimum password length >= 12'
    type: password_number
    field: minimum-length
    comparator: gte
    threshold: 12
  - id: '1.3.3'
    title: 'Minimum uppercase letters >= 1'
    type: password_number
    field: minimum-uppercase-letters
    comparator: gte
    threshold: 1
  - id: '1.3.4'
    title: 'Minimum lowercase letters >= 1'
    type: password_number
    field: minimum-lowercase-letters
    comparator: gte
    threshold: 1
  - id: '1.3.5'
    title: 'Minimum numeric letters >= 1'
    type: password_number
    field: minimum-numeric-letters
    comparator: gte
    threshold: 1
  - id: '1.3.6'
    title: 'Minimum special characters >= 1'
    type: password_number
    field: minimum-special-characters
    comparator: gte
    threshold: 1
  - id: '1.3.7'
    title: 'Password change period <= 90 days'
    type: password_number
    field: password-change/expiration-period
    comparator: lte
    threshold: 90
    minimum: 1
  - id: '1.3.8'
    title: 'New password differs by >= 3 characters'
    type: password_number
    field: new-password-differs-by-characters
    comparator: gte
    threshold: 3
  - id: '1.3.9'
    title: 'Password history >= 24'
    type: password_number
    field: password-history-count
    comparator: gte
    threshold: 24
  - id: '1.4.1'
    title: 'Management idle timeout <= 10 minutes'
    type: idle_timeout
  - id: '1.6.2'
    title: 'Primary and secondary NTP configured appropriately'
    type: ntp
  - id: '3.1'
    title: 'HA peer state / synchronization'
    type: ha_sync
  - id: '3.2'
    title: 'HA link or path monitoring'
    type: ha_monitoring
