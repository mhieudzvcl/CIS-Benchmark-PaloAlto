benchmark: 'CIS Palo Alto Firewall 11 Benchmark v1.2.0'
# Bo quy tac kiem tra tu dong CIS Benchmark mo rong
controls:
  - id: '1.1.2'
    title: 'Ensure Login Banner is configured'
    type: login_banner
  - id: '1.1.3'
    title: 'Ensure Log on High DP Load is enabled'
    type: log_high_dp_load
  - id: '1.2.1'
    title: 'Ensure Permitted IP Addresses for management interface is configured'
    type: permitted_ip
  - id: '1.2.3'
    title: 'Disable HTTP and Telnet on management interface'
    type: management_services
  - id: '1.2.4'
    title: 'Ensure Management Interface Profiles disable HTTP and Telnet'
    type: interface_mgmt_profile
  - id: '1.3.1'
    title: 'Minimum Password Complexity enabled'
    type: password_enabled
  - id: '1.3.2'
    title: 'Minimum password length >= 12'
    type: password_number
    field: minimum-length
    comparator: gte
    threshold: 12
  - id: '1.3.3'
    title: 'Minimum uppercase letters >= 1'
    type: password_number
    field: minimum-uppercase-letters
    comparator: gte
    threshold: 1
  - id: '1.3.4'
    title: 'Minimum lowercase letters >= 1'
    type: password_number
    field: minimum-lowercase-letters
    comparator: gte
    threshold: 1
  - id: '1.3.5'
    title: 'Minimum numeric letters >= 1'
    type: password_number
    field: minimum-numeric-letters
    comparator: gte
    threshold: 1
  - id: '1.3.6'
    title: 'Minimum special characters >= 1'
    type: password_number
    field: minimum-special-characters
    comparator: gte
    threshold: 1
  - id: '1.3.7'
    title: 'Password change period <= 90 days'
    type: password_number
    field: password-change/expiration-period
    comparator: lte
    threshold: 90
    minimum: 1
  - id: '1.3.8'
    title: 'New password differs by >= 3 characters'
    type: password_number
    field: new-password-differs-by-characters
    comparator: gte
    threshold: 3
  - id: '1.3.9'
    title: 'Password history >= 24'
    type: password_number
    field: password-history-count
    comparator: gte
    threshold: 24
  - id: '1.3.10'
    title: 'Ensure no overriding Password Profiles exist'
    type: no_custom_password_profiles
  - id: '1.4.1'
    title: 'Management idle timeout <= 10 minutes'
    type: idle_timeout
  - id: '1.4.2'
    title: 'Failed login attempts lockout threshold <= 5'
    type: failed_attempts
  - id: '1.4.3'
    title: 'Lockout time for failed logins >= 15 minutes'
    type: lockout_time
  - id: '1.5.1'
    title: 'SNMPv3 enabled or SNMP disabled'
    type: snmp_security
  - id: '1.6.1'
    title: 'Verify Update Server Identity enabled'
    type: verify_update_server
  - id: '1.6.2'
    title: 'Primary and secondary NTP configured appropriately'
    type: ntp
  - id: '1.7.1'
    title: 'Syslog server profile is configured'
    type: syslog_configured
  - id: '3.1'
    title: 'HA peer state / synchronization'
    type: ha_sync
  - id: '3.2'
    title: 'HA link or path monitoring'
    type: ha_monitoring
  - id: '3.3'
    title: 'HA passive link state is auto and preemption disabled'
    type: ha_passive_link_and_preemption
  - id: '6.15'
    title: 'Zone Protection Profile enables SYN Flood protection with SYN Cookies'
    type: zone_protection_syn_cookies
  - id: '6.18'
    title: 'Zone Protection Profile drops spoofed IP and invalid TCP segments'
    type: zone_protection_packet_drop
  - id: '7.2'
    title: 'Security rules do not allow service ANY from untrusted zone'
    type: security_service_any
  - id: '7.3'
    title: 'Security policy blocks malicious IPs at top of rulebase'
    type: security_policy_block_malicious
  - id: '7.4'
    title: 'Default security rules log at session end'
    type: default_rule_logging
  - id: '1.2.2'
    title: 'Ensure Permitted IP Addresses is set for all management profiles where SSH, HTTPS, or SNMP is enabled'
    type: interface_mgmt_profile_permitted_ip
  - id: '2.3'
    title: 'Ensure User-ID is only enabled for internal trusted interfaces'
    type: user_id_trusted_only
  - id: '5.1'
    title: 'Ensure WildFire file size upload limits are maximized'
    type: wildfire_max_file_size
  - id: '5.4'
    title: 'Ensure all WildFire session information settings are enabled'
    type: wildfire_session_info
  - id: '6.16'
    title: 'Zone Protection Profile enables Flood Protection for all flood types'
    type: zone_protection_flood_all
  - id: '6.17'
    title: 'Zone Protection Profile enables Reconnaissance Protection'
    type: zone_protection_reconnaissance
  - id: '7.1'
    title: 'Security rules do not allow application ANY from untrusted zone'
    type: security_application_any
